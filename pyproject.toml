[project]
name = "evaldock"
version = "0.1.0"
description = "Generic AI evaluation and regression workbench"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "psycopg[binary,pool]>=3.2,<4", "alembic>=1.14,<2", "procrastinate>=3.3,<4",
  "httpx>=0.28,<1", "aiohttp>=3.11,<4", "argon2-cffi>=23.1",
  "cryptography>=44", "jsonschema>=4.23,<5", "openai>=2,<3", "typer>=0.15,<1"
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.11", "mypy>=1.15", "types-jsonschema", "respx>=0.22"]
[project.scripts]
evaldock = "evaldock_cli.main:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["apps/api/evaldock", "packages/cli/evaldock_cli"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["apps/api/tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
files = ["apps/api/evaldock", "packages/cli/evaldock_cli"]
