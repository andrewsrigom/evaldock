name: evaldock
x-backend: &backend
  build:
    context: .
    dockerfile: infra/api.Dockerfile
  env_file: .env
  environment: &backend-environment
    OPENAI_API_KEY: ""
    OPENAI_CREDENTIAL_ID: ""
    DATABASE_URL: postgresql+psycopg://evaldock:${POSTGRES_PASSWORD}@db:5432/evaldock
    ARTIFACT_DIR: /data/artifacts
  volumes:
    - artifacts:/data/artifacts
  restart: unless-stopped
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evaldock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evaldock
    ports:
      - "127.0.0.1:5492:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaldock -d evaldock"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: ["sh", "-c", "uv run alembic upgrade head && uv run python -m evaldock.bootstrap"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *backend
    environment: &ai-environment
      <<: *backend-environment
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CREDENTIAL_ID: ${OPENAI_CREDENTIAL_ID:-}
    command: ["uv", "run", "uvicorn", "evaldock.api:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *backend
    environment: *ai-environment
    command: ["uv", "run", "python", "-m", "evaldock.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      samples:
        condition: service_started
  samples:
    <<: *backend
    command: ["uv", "run", "uvicorn", "examples.targets:app", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "127.0.0.1:8099:8090"
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports:
      - "127.0.0.1:5188:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  postgres:
  artifacts:
