upstream evaldock_api {
  zone evaldock_api 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;
  server api:8080 resolve;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 10m;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
  location /api/ {
    proxy_pass http://evaldock_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 130s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
